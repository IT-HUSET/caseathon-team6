[project]
name = "policy-insight"
version = "0.1.0"
description = "Policy Insight — turn If Industrial's policy archive into a queryable, evidenced knowledge source (caseathon prototype)"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pypdfium2>=4.30",
    "pillow>=10.4",
    "streamlit>=1.40",
    "pandas>=2.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
]

# Flat layout of top-level packages (ingest/, index/, query/, ui/); nothing to build or install.
[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
